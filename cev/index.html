<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive Q&A about Arun Johnson's green hydrogen project at Climate Energy Ventures.">
  <meta property="og:title" content="Climate Energy Ventures | Arun Johnson">
  <meta property="og:description" content="Questions and answers about a lower-capital-cost architecture for green hydrogen production.">
  <title>Climate Energy Ventures | Arun Johnson</title>
  <link rel="icon" type="image/png" href="../ArunIcon_Basalt.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="cev.css">
</head>
<body class="cev-page" data-qna-api="/api/qna/public" data-qna-static="../data/qna.json">
<button id="site-menu-toggle" class="site-menu-toggle" type="button" aria-label="Open site menu" aria-controls="site-menu" aria-expanded="false">
  <i class="fa-solid fa-bars" aria-hidden="true"></i>
</button>
<nav id="site-menu" class="site-menu" aria-label="Main site menu" hidden>
  <div class="site-menu-inner">
    <a href="https://arunjohnson.com/#contact">Contact</a>
    <a href="https://arunjohnson.com/#publications">Publications</a>
    <a href="https://arunjohnson.com/#work">Work</a>
    <a href="https://arunjohnson.com/new-years-resolutions.html">New Year's Resolutions</a>
    <a href="https://limiting.substack.com" target="_blank" rel="noopener noreferrer">Blog (Nichrome)</a>
    <a href="https://t.me/s/nichromewire" target="_blank" rel="noopener noreferrer">Nichrome Shorts</a>
    <a class="resume-link" href="../One-Page%20Resume.pdf" download="Arun-Johnson-Resume.pdf">Resume <i class="fa-solid fa-download" aria-hidden="true"></i></a>
  </div>
</nav>
<main class="qa-shell">
  <section class="qa-card" aria-label="Ask Arun about green hydrogen">
    <div class="qa-actions">
      <button id="reset-questions" class="icon-button reset-button" type="button" aria-label="Back to main questions" hidden>
        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
      </button>
    </div>

    <div class="portrait-wrap">
      <img src="../ArunIcon_Basalt.png" alt="Arun Johnson" class="portrait" loading="eager">
    </div>

    <div class="current-response">
      <div id="profile-blurb" class="profile-blurb" aria-live="polite">
        <p>Hello! I'm <a href="https://www.linkedin.com/in/arunsjohnson/" target="_blank" rel="noopener noreferrer">Arun</a>.</p>
      </div>
    </div>

    <div id="question-options" class="question-options" aria-live="polite"></div>

    <form id="free-question-form" class="free-question-form">
      <label for="free-question">Ask something else</label>
      <div class="free-question-control">
        <textarea id="free-question" name="question" rows="1" placeholder="Type a question for Arun..." autocomplete="off"></textarea>
        <button class="send-button" type="submit" aria-label="Continue by email">
          <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
        </button>
      </div>
    </form>

    <form id="email-draft-form" class="email-draft-form" hidden>
      <div class="email-draft-header">
        <p>Email Arun</p>
        <button id="close-email-draft" class="icon-button" type="button" aria-label="Close email draft">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <label for="visitor-email">Your email address</label>
      <input id="visitor-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <label for="draft-message">Message</label>
      <textarea id="draft-message" name="message" rows="5" required></textarea>
      <button class="draft-send-button" type="submit">Send</button>
      <p id="email-status" class="email-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<script src="../scripts/qna.js" defer></script>
</body>
</html>
